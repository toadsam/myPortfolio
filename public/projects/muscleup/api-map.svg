<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="득근득근 백엔드 API 도메인 지도 — 컨트롤러 28개, 엔드포인트 136개를 8개 도메인으로 묶은 그림">
  <title>득근득근 API 도메인 지도</title>
  <desc>Spring Boot 컨트롤러 28개(엔드포인트 136개)를 인증·기록/AI·커뮤니티·크루·친구/라운지·프로틴 공유·이벤트·운영 8개 도메인으로 묶었다. 각 상자는 실제 클래스 이름과 엔드포인트 수다.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#070f1a"/>
    </linearGradient>
    <style>
      .h  { font: 700 30px "Pretendard","Noto Sans KR",system-ui,sans-serif; fill:#f3e6c8 }
      .sub{ font: 400 17px "Pretendard","Noto Sans KR",system-ui,sans-serif; fill:#f3e6c8; opacity:.85 }
      .g  { font: 700 19px "Pretendard","Noto Sans KR",system-ui,sans-serif }
      .gc { font: 700 15px ui-monospace,"SFMono-Regular",Menlo,monospace; opacity:.75 }
      .c  { font: 600 15px ui-monospace,"SFMono-Regular",Menlo,monospace; fill:#f3e6c8 }
      .n  { font: 700 15px ui-monospace,"SFMono-Regular",Menlo,monospace; fill:#f3e6c8 }
      .p  { font: 400 13px ui-monospace,"SFMono-Regular",Menlo,monospace; fill:#f3e6c8; opacity:.6 }
      .note{ font: 400 13px "Pretendard","Noto Sans KR",system-ui,sans-serif; fill:#e2c078; opacity:.75 }
      .foot{ font: 400 15px "Pretendard","Noto Sans KR",system-ui,sans-serif; fill:#f3e6c8; opacity:.7 }
    </style>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>

  <text class="h" x="48" y="56">백엔드 API 도메인 지도</text>
  <text class="sub" x="48" y="86">컨트롤러 <tspan font-weight="700" fill="#f3e6c8">28</tspan>개 · 엔드포인트 <tspan font-weight="700" fill="#f3e6c8">136</tspan>개를 8개 도메인으로 묶었다. 상자 안은 실제 클래스 이름과 그 클래스의 엔드포인트 수.</text>

  <!-- ── 1행 ───────────────────────────────────────────── -->

  <!-- 인증 -->
  <g transform="translate(48,120)">
    <rect width="380" height="272" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#e2c078">인증 · 사용자</text>
    <text class="gc" x="360" y="34" text-anchor="end" fill="#e2c078">11 EP</text>
    <line x1="20" y1="48" x2="360" y2="48" stroke="#e2c07833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">AuthController</text><text class="n" x="340" y="0" text-anchor="end">7</text>
      <text class="p" y="18">/api/auth · 로그인 · 구글 · 이메일 인증 · 재발급</text>
      <text class="c" y="52">UserController</text><text class="n" x="340" y="52" text-anchor="end">1</text>
      <text class="p" y="70">/api/users</text>
      <text class="c" y="104">MyPageController</text><text class="n" x="340" y="104" text-anchor="end">1</text>
      <text class="p" y="122">/api/mypage</text>
      <text class="c" y="156">StatsController</text><text class="n" x="340" y="156" text-anchor="end">2</text>
      <text class="p" y="174">/api/mypage/stats</text>
    </g>
  </g>

  <!-- 기록·AI -->
  <g transform="translate(452,120)">
    <rect width="380" height="272" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#f3e6c8">운동 기록 · AI 코치</text>
    <text class="gc" x="360" y="34" text-anchor="end" fill="#f3e6c8">28 EP</text>
    <line x1="20" y1="48" x2="360" y2="48" stroke="#f3e6c833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">AttendanceController</text><text class="n" x="340" y="0" text-anchor="end">11</text>
      <text class="p" y="18">/api/attendance · 출석 기록 · 공유</text>
      <text class="c" y="52">AiController</text><text class="n" x="340" y="52" text-anchor="end">10</text>
      <text class="p" y="70">/api/ai · 분석 · 루틴 생성 · 대화 이력</text>
      <text class="c" y="104">CharacterController</text><text class="n" x="340" y="104" text-anchor="end">5</text>
      <text class="p" y="122">/api/character · 성장 · 진화</text>
      <text class="c" y="156">Ranking · AttendanceSharePage</text><text class="n" x="340" y="156" text-anchor="end">2</text>
      <text class="p" y="174">/api/rankings · 공유 슬러그 페이지</text>
    </g>
  </g>

  <!-- 커뮤니티 -->
  <g transform="translate(856,120)">
    <rect width="380" height="272" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#e2c078">커뮤니티 (자랑방)</text>
    <text class="gc" x="360" y="34" text-anchor="end" fill="#e2c078">11 EP</text>
    <line x1="20" y1="48" x2="360" y2="48" stroke="#e2c07833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">BragPostController</text><text class="n" x="340" y="0" text-anchor="end">5</text>
      <text class="p" y="18">/api/brags · 글 작성 · 목록 · 공개 범위</text>
      <text class="c" y="52">BragInteractionController</text><text class="n" x="340" y="52" text-anchor="end">6</text>
      <text class="p" y="70">/api/brags · 댓글 · 좋아요</text>
    </g>
    <text class="note" x="20" y="228">한 base path 를 두 컨트롤러가 나눠 쓴다 —</text>
    <text class="note" x="20" y="246">글 자체와 반응(댓글·좋아요)의 책임을 갈랐다.</text>
  </g>

  <!-- 크루 -->
  <g transform="translate(1260,120)">
    <rect width="372" height="272" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#f3e6c8">크루</text>
    <text class="gc" x="352" y="34" text-anchor="end" fill="#f3e6c8">15 EP</text>
    <line x1="20" y1="48" x2="352" y2="48" stroke="#f3e6c833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">CrewController</text><text class="n" x="332" y="0" text-anchor="end">15</text>
      <text class="p" y="18">/api/crew</text>
    </g>
    <text class="note" x="20" y="140">단일 컨트롤러 중 가장 크다.</text>
    <text class="note" x="20" y="158">생성 · 초대코드 · 가입 신청 ·</text>
    <text class="note" x="20" y="176">승인/거절 · 멤버 역할 · 챌린지가</text>
    <text class="note" x="20" y="194">한 곳에 모여 있다.</text>
    <text class="note" x="20" y="228">가입 정책은 자동승인 / 리더승인</text>
    <text class="note" x="20" y="246">두 가지(CrewJoinPolicy).</text>
  </g>

  <!-- ── 2행 ───────────────────────────────────────────── -->

  <!-- 친구·라운지 -->
  <g transform="translate(48,416)">
    <rect width="380" height="248" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#e2c078">친구 · 라운지</text>
    <text class="gc" x="360" y="34" text-anchor="end" fill="#e2c078">11 EP</text>
    <line x1="20" y1="48" x2="360" y2="48" stroke="#e2c07833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">FriendController</text><text class="n" x="340" y="0" text-anchor="end">10</text>
      <text class="p" y="18">/api/friends · 요청 · 수락 · 1:1 채팅방</text>
      <text class="c" y="52">LoungeController</text><text class="n" x="340" y="52" text-anchor="end">1</text>
      <text class="p" y="70">/api/lounge</text>
    </g>
    <text class="note" x="20" y="200">라운지의 실시간 위치·채팅은 REST 가 아니라</text>
    <text class="note" x="20" y="218">별도 Socket.IO 서버(:4001)가 맡는다.</text>
  </g>

  <!-- 프로틴 공유 -->
  <g transform="translate(452,416)">
    <rect width="380" height="248" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#f3e6c8">프로틴 공유</text>
    <text class="gc" x="360" y="34" text-anchor="end" fill="#f3e6c8">16 EP</text>
    <line x1="20" y1="48" x2="360" y2="48" stroke="#f3e6c833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">ProteinController</text><text class="n" x="340" y="0" text-anchor="end">5</text>
      <text class="p" y="18">/api/proteins · 등록 · 목록</text>
      <text class="c" y="52">ProteinShareController</text><text class="n" x="340" y="52" text-anchor="end">7</text>
      <text class="p" y="70">/api/proteins/{id} · 신청 · 쪽지</text>
      <text class="c" y="104">ReviewController</text><text class="n" x="340" y="104" text-anchor="end">4</text>
      <text class="p" y="122">/api/reviews · 거래 후기</text>
    </g>
    <text class="note" x="20" y="214">사이트 어디에도 안 나와 있던 기능이다 —</text>
    <text class="note" x="20" y="232">신청 · 쪽지 · 후기까지 갖춘 거래 흐름.</text>
  </g>

  <!-- 이벤트 -->
  <g transform="translate(856,416)">
    <rect width="380" height="248" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#e2c078">이벤트 · 프로그램</text>
    <text class="gc" x="360" y="34" text-anchor="end" fill="#e2c078">15 EP</text>
    <line x1="20" y1="48" x2="360" y2="48" stroke="#e2c07833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">AdminEventController</text><text class="n" x="340" y="0" text-anchor="end">8</text>
      <text class="p" y="18">/api/admin/events · CMS 편집</text>
      <text class="c" y="52">EventPublicController</text><text class="n" x="340" y="52" text-anchor="end">4</text>
      <text class="p" y="70">/api/events · 공개 조회</text>
      <text class="c" y="104">EventController · ProgramApplication</text><text class="n" x="340" y="104" text-anchor="end">3</text>
      <text class="p" y="122">/api/events · /api/programs</text>
    </g>
    <text class="note" x="20" y="214">읽기(공개)와 쓰기(관리자)를 컨트롤러 자체로</text>
    <text class="note" x="20" y="232">갈라 권한 경계를 URL 에 드러냈다.</text>
  </g>

  <!-- 운영 -->
  <g transform="translate(1260,416)">
    <rect width="372" height="248" rx="14" fill="#e2c0780f" stroke="#e2c07855"/>
    <text class="g" x="20" y="34" fill="#f3e6c8">운영 · 인프라</text>
    <text class="gc" x="352" y="34" text-anchor="end" fill="#f3e6c8">29 EP</text>
    <line x1="20" y1="48" x2="352" y2="48" stroke="#f3e6c833"/>
    <g transform="translate(20,74)">
      <text class="c" y="0">AdminController</text><text class="n" x="332" y="0" text-anchor="end">16</text>
      <text class="p" y="18">/api/admin · 회원 · 신고 · 감사 로그</text>
      <text class="c" y="52">FileController</text><text class="n" x="332" y="52" text-anchor="end">5</text>
      <text class="p" y="70">/api/files · 로컬 ↔ S3 토글</text>
      <text class="c" y="104">Analytics · Metrics · Support</text><text class="n" x="332" y="104" text-anchor="end">4</text>
      <text class="p" y="122">이벤트 수집 · 지표 · 문의</text>
      <text class="c" y="156">Health · Hello</text><text class="n" x="332" y="156" text-anchor="end">4</text>
      <text class="p" y="174">헬스체크</text>
    </g>
  </g>

  <text class="foot" x="48" y="700">근거: backend/src/main/java/com/ajou/muscleup/controller/*.java — 클래스 28개의 @RequestMapping 과 @Get/Post/Put/Patch/DeleteMapping 을 센 값.</text>
</svg>
